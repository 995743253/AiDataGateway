name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix, for example 0.7.0
        required: true
        default: 0.7.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/AiDataGateway.Web/package-lock.json
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = '${{ inputs.version }}'
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build release assets
        shell: pwsh
        run: ./build/Publish-Release.ps1 -Version '${{ steps.version.outputs.value }}'
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AiDataGateway-${{ steps.version.outputs.value }}-win-x64
          path: artifacts/release/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath artifacts/release -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME $assets --verify-tag --generate-notes --title "AiDataGateway $env:GITHUB_REF_NAME"
