<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>本机监控分析报告</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#172b4d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:22px}.toolbar,.hero,.card{background:#fff;border:1px solid #dfe7f0;border-radius:14px;box-shadow:0 5px 22px rgba(26,58,91,.06)}.toolbar{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:16px}.toolbar select,.toolbar input{height:36px;padding:0 10px;border:1px solid #cfd9e5;border-radius:8px;background:#fff}.toolbar select{min-width:230px}.toolbar button{height:36px;padding:0 18px;color:#fff;background:#1769aa;border:0;border-radius:8px;cursor:pointer}.toolbar button:disabled{opacity:.55}.hero{display:grid;grid-template-columns:1fr auto;gap:24px;padding:24px;background:linear-gradient(120deg,#102a4a,#1769aa);color:#fff}.hero h1{margin:0 0 8px;font-size:24px}.hero p{margin:0;color:#c8ddf1}.score{display:grid;width:112px;height:112px;place-items:center;border:8px solid rgba(255,255,255,.25);border-radius:50%;font-size:30px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:16px 0}.card{padding:18px;min-width:0}.metric h3{margin:0;color:#68788d;font-size:13px}.metric strong{display:block;margin:10px 0 5px;font-size:27px}.metric small{color:#7f8b9a}.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.chart svg{width:100%;height:170px}.axis{stroke:#dfe7ef;stroke-width:1}.line{fill:none;stroke:#2084c5;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.chart-head{display:flex;justify-content:space-between;margin-bottom:8px}.chart-head span{color:#7b8798;font-size:12px}.findings{display:grid;gap:8px;margin:0;padding-left:20px;line-height:1.65}.markdown{max-height:260px;margin:0;overflow:auto;padding:14px;color:#dceafa;background:#10253f;border-radius:10px;white-space:pre-wrap}.empty{padding:60px;text-align:center;color:#78869a}.error{margin:12px 0;padding:12px;color:#a53030;background:#fff1f0;border:1px solid #f3c7c4;border-radius:8px}@media(max-width:900px){.grid,.charts{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.toolbar select{width:100%}}
  </style>
</head>
<body>
  <div class="toolbar"><select id="target"></select><label>最近 <input id="hours" type="number" min="1" max="168" value="24" style="width:80px"> 小时</label><button id="run">生成分析报告</button><span id="state"></span></div>
  <div id="error"></div><main id="content"><div class="empty">正在读取可用监控节点…</div></main>
  <script>
    const api='/api/custom-modules/local-monitor-report/invoke/';const target=document.querySelector('#target');const hours=document.querySelector('#hours');const run=document.querySelector('#run');const content=document.querySelector('#content');const error=document.querySelector('#error');
    const call=async(name,args={})=>{const res=await fetch(api+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args)});const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.message||'调用失败');return body};
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const chart=series=>{const values=series.points.map(x=>x.value);if(values.length<2)return '<div class="empty">采样点不足</div>';const min=Math.min(...values),max=Math.max(...values),range=Math.max(1,max-min);const pts=series.points.map((p,i)=>`${10+i*380/(values.length-1)},${145-(p.value-min)*125/range}`).join(' ');return `<svg viewBox="0 0 400 160"><line class="axis" x1="10" y1="145" x2="390" y2="145"/><polyline class="line" points="${pts}"/></svg>`};
    const render=r=>{content.innerHTML=`<section class="hero"><div><h1>${esc(r.title)}</h1><p>生成时间 ${new Date(r.generatedAtUtc).toLocaleString()} · ${r.sourceCount} 条原始采样</p></div><div class="score">${r.score}</div></section><section class="grid">${r.summaries.map(x=>`<article class="card metric"><h3>${esc(x.name)}</h3><strong>${x.latest.toFixed(1)}${x.unit}</strong><small>平均 ${x.average.toFixed(1)} · 最高 ${x.maximum.toFixed(1)} · ${x.trend}</small></article>`).join('')}</section><section class="charts">${r.series.map(x=>`<article class="card chart"><div class="chart-head"><strong>${esc(x.name)}趋势</strong><span>${x.points.length} 点</span></div>${chart(x)}</article>`).join('')}</section><section class="grid" style="grid-template-columns:1fr 1fr"><article class="card"><h3>分析结论</h3><ul class="findings">${r.findings.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article><article class="card"><h3>提供给 AI 的 Markdown</h3><pre class="markdown">${esc(r.markdown)}</pre></article></section>`};
    const loadTargets=async()=>{try{const r=await call('list_targets');target.innerHTML=r.items.map(x=>`<option value="${esc(x.key)}">${esc(x.name)}（${esc(x.key)}）</option>`).join('');const local=r.items.find(x=>x.key==='local');if(local)target.value='local';if(r.items.length)await generate();else content.innerHTML='<div class="empty">暂无可用监控节点</div>'}catch(e){showError(e)}};
    const generate=async()=>{run.disabled=true;error.innerHTML='';document.querySelector('#state').textContent='分析中…';try{render(await call('generate_report',{targetKey:target.value,hours:Number(hours.value)||24}))}catch(e){showError(e)}finally{run.disabled=false;document.querySelector('#state').textContent=''}};
    const showError=e=>error.innerHTML=`<div class="error">${esc(e.message)}</div>`;run.addEventListener('click',generate);loadTargets();
  </script>
</body>
</html>
