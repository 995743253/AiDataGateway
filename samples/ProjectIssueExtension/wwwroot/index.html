<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>项目问题单</title>
  <style>
    :root{font-family:"Microsoft YaHei UI",system-ui,sans-serif;color:#253247;background:#f4f6fa}*{box-sizing:border-box}body{margin:0;padding:24px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d5deea;background:white;border-radius:8px;padding:9px 15px;color:#35455c}button:hover{border-color:#409eff;color:#409eff}.primary{background:#409eff;border-color:#409eff;color:white}.primary:hover{background:#66b1ff;color:white}.danger{color:#d94d4d}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{font-size:24px;margin:0 0 5px}.muted{color:#8390a3;font-size:12px}.card{background:white;border:1px solid #e5eaf2;border-radius:12px;box-shadow:0 5px 20px #25324708}.filters{padding:18px;display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:16px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.summary .card{padding:15px 17px;min-width:0}.summary strong{display:block;margin-top:8px;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.summary .muted{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.field{display:flex;flex-direction:column;gap:6px;min-width:150px}.field label{color:#6e7e91;font-size:12px}.field input,.field select,.field textarea{border:1px solid #d7deea;border-radius:7px;background:white;padding:9px 11px;min-height:38px;color:#26354c;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#409eff}.field textarea{min-height:90px;resize:vertical}.grow{flex:1}.table-wrap{overflow:auto}.table{border-collapse:collapse;width:100%;min-width:1180px}.table th,.table td{padding:13px 16px;border-bottom:1px solid #edf0f5;text-align:left;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.table th{font-size:12px;color:#78879a;background:#fafbfe}.table td{font-size:13px}.table tr:hover td{background:#f8fbff}.pill{display:inline-block;border-radius:20px;background:#ecf5ff;color:#337ecc;padding:4px 9px;font-size:11px}.pill.done{background:#f0f9eb;color:#529b2e}.pill.doing{background:#fdf6ec;color:#b88230}.pill.none{background:#f4f4f5;color:#909399}.empty{padding:70px;text-align:center;color:#8a97a8}.pager{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 16px}.toast{position:fixed;top:20px;right:20px;z-index:30;background:#e7f7ec;color:#347749;padding:11px 16px;border-radius:8px;box-shadow:0 8px 24px #283d5620}.toast.error{background:#fff0f0;color:#bd3e3e}.overlay{position:fixed;inset:0;z-index:10;background:#17233d77;display:none;align-items:center;justify-content:center;padding:20px}.overlay.open{display:flex}.dialog{width:min(820px,100%);max-height:92vh;overflow:auto;padding:24px;background:white;border-radius:14px;box-shadow:0 18px 50px #14223e44}.dialog h2{margin:0 0 18px;font-size:19px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}.span2{grid-column:span 2}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.filebox{border:1px dashed #aabbd1;background:#f8fbff;border-radius:8px;padding:16px}.hint{font-size:12px;line-height:1.7;color:#78879a}.detail{display:grid;grid-template-columns:160px 1fr;gap:9px 16px;font-size:13px}.detail dt{color:#8492a4}.detail dd{margin:0;white-space:pre-wrap;word-break:break-word}.detail a{color:#337ecc}.history{margin:0;padding-left:16px;color:#5c6b7e}.history li{margin:3px 0}#reportText{width:100%;min-height:260px;border:1px solid #d7deea;border-radius:8px;padding:12px;font:13px/1.8 Consolas,"Microsoft YaHei UI",monospace;color:#26354c;white-space:pre-wrap}.report-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}@media(max-width:700px){body{padding:12px}.top{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.span2{grid-column:span 1}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <header class="top"><div><h1>项目问题单</h1><div class="muted">集中管理 Q 单、个案、测试状态、变动状态与来源文档；日报归纳当天变动</div></div><div><button id="reportButton">当天日报</button> <button id="importButton">导入表格</button> <button id="newButton" class="primary">＋ 新建问题</button></div></header>
  <section class="card filters">
    <div class="field"><label>项目</label><select id="project" style="min-width:210px"></select></div>
    <div class="field grow"><label>搜索单号、个案、程序、说明或解决描述</label><input id="keyword" placeholder="输入关键词后按回车" /></div>
    <div class="field"><label>测试状态</label><select id="status"><option value="">全部状态</option></select></div>
    <div class="field"><label>变动状态</label><select id="workflow"><option value="">全部</option><option value="-">未标记</option></select></div>
    <button id="searchButton" class="primary">查询</button>
  </section>
  <section id="summary" class="summary"></section>
  <section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Q 单编号</th><th>测试状态</th><th>变动状态</th><th>是否解决</th><th>类别</th><th>个案书名</th><th>程序名称</th><th>问题处理人</th><th>来源</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><span id="count" class="muted"></span><button id="prev">上一页</button><span id="pageText"></span><button id="next">下一页</button></div></section>
  <div id="editorOverlay" class="overlay"><div class="dialog"><h2 id="editorTitle">新建问题</h2><div id="editorFields" class="form-grid"></div><div class="actions"><button data-close="editorOverlay">取消</button><button id="saveButton" class="primary">保存问题</button></div></div></div>
  <div id="importOverlay" class="overlay"><div class="dialog"><h2>导入问题单</h2><p class="hint">支持 .xlsx、.csv、.tsv（单文件不超过 5 MB）；也可在金山文档等在线表格中选中表头和数据区域，复制后粘贴到下方。需要登录的在线文档请先由用户导出或复制，不会绕过访问权限。表格可包含“变动状态”“解决描述”列；未填写变动状态的新记录不设变动时间。</p><div class="form-grid"><div class="field span2 filebox"><label>选择 Excel/CSV 文件</label><input id="importFile" type="file" accept=".xlsx,.csv,.tsv,.txt" /></div><div class="field span2"><label>或粘贴在线表格内容（含表头）</label><textarea id="importText" style="min-height:140px" placeholder="Q单编号&#9;测试状态&#9;变动状态&#9;个案书名&#10;QTB...&#9;已完成&#9;处理完成&#9;..."></textarea></div><div class="field span2"><label>原始在线文档链接（可选，供追溯）</label><input id="sourceUrl" type="url" placeholder="https://www.kdocs.cn/l/..." /></div></div><div class="actions"><button data-close="importOverlay">取消</button><button id="importSubmit" class="primary">确认导入</button></div></div></div>
  <div id="detailOverlay" class="overlay"><div class="dialog"><h2>问题详情</h2><dl id="detail" class="detail"></dl><div class="actions"><button data-close="detailOverlay">关闭</button></div></div></div>
  <div id="reportOverlay" class="overlay"><div class="dialog"><h2>当天变动日报</h2><div class="report-bar"><span id="reportSummary" class="muted"></span><div><input id="reportDate" type="date" style="margin-right:8px;border:1px solid #d7deea;border-radius:7px;padding:8px 10px" /><button id="reportRefresh">刷新</button> <button id="reportCopy" class="primary">复制内容</button></div></div><textarea id="reportText" readonly></textarea><div class="actions"><button data-close="reportOverlay">关闭</button></div></div></div>
  <script>
    const root='/api/custom-modules/project-issue-tracker/invoke/';const $=s=>document.querySelector(s);let page=1,total=0,items=[],current=null,projects=[];
    const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function call(name,args={}){const response=await fetch(root+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args)});let body={};try{body=await response.json()}catch{}if(!response.ok)throw Error(body.message||body.detail||`调用失败（${response.status}）`);return body}
    const projectCode=()=>$('#project').value;
    const localTime=v=>v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'';
    const workflowClass=v=>{const s=(v||'').trim();if(!s)return 'none';if(/完成|关闭|解决/.test(s))return 'done';if(/处理中|进行|开发|待/.test(s))return 'doing';return ''};
    function toast(message,error=false){document.querySelector('.toast')?.remove();const node=document.createElement('div');node.className='toast'+(error?' error':'');node.textContent=message;document.body.append(node);setTimeout(()=>node.remove(),4500)}
    function open(id){$('#'+id).classList.add('open')}function close(id){$('#'+id).classList.remove('open')}
    async function loadProjects(){try{const result=await call('list_projects');projects=result.items;$('#project').innerHTML=projects.map(p=>`<option value="${escapeHtml(p.code)}">${escapeHtml(p.name)}（${escapeHtml(p.code)}）</option>`).join('');if(projects.length)await load();else $('#rows').innerHTML='<tr><td colspan="10" class="empty">暂无已启用项目，请先在主系统创建项目。</td></tr>'}catch(error){toast(error.message,true)}}
    async function loadSummary(){if(!projectCode())return;const r=await call('summarize_issues',{projectCode:projectCode()});const topWorkflow=r.workflowStatuses[0],open=r.resolution.find(x=>x.name==='否');const cards=[['问题总数',r.total],['有 Q 单号',r.withTicket],['最多变动状态',topWorkflow?`${topWorkflow.name} · ${topWorkflow.count}`:'暂无'],['未解决',open?.count||0]];$('#summary').innerHTML=cards.map(([label,value])=>`<article class="card"><span class="muted">${escapeHtml(label)}</span><strong title="${escapeHtml(value)}">${escapeHtml(value)}</strong></article>`).join('');const selected=$('#status').value;$('#status').innerHTML='<option value="">全部状态</option>'+r.statuses.filter(x=>x.name!=='未标记').map(x=>`<option value="${escapeHtml(x.name)}">${escapeHtml(x.name)}（${x.count}）</option>`).join('');$('#status').value=selected;const wfSelected=$('#workflow').value;$('#workflow').innerHTML='<option value="">全部</option><option value="-">未标记</option>'+r.workflowStatuses.filter(x=>x.name!=='未标记').map(x=>`<option value="${escapeHtml(x.name)}">${escapeHtml(x.name)}（${x.count}）</option>`).join('');$('#workflow').value=wfSelected}
    async function load(){if(!projectCode())return;try{const result=await call('list_issues',{projectCode:projectCode(),keyword:$('#keyword').value.trim(),status:$('#status').value,workflowStatus:$('#workflow').value,page,pageSize:30});items=result.items;total=result.total;$('#rows').innerHTML=items.length?items.map((x,i)=>{const changed=localTime(x.workflowStatusChangedAtUtc);return `<tr><td title="${escapeHtml(x.ticketNumber)}">${escapeHtml(x.ticketNumber||'—')}</td><td><span class="pill">${escapeHtml(x.testStatus||'未标记')}</span></td><td><span class="pill ${workflowClass(x.workflowStatus)}" title="${escapeHtml(changed?`变动时间 ${changed}`:'尚未变动')}">${escapeHtml(x.workflowStatus||'未标记')}</span></td><td>${escapeHtml(x.resolved||'—')}</td><td>${escapeHtml(x.category||'—')}</td><td title="${escapeHtml(x.caseName)}">${escapeHtml(x.caseName||'—')}</td><td title="${escapeHtml(x.programName)}">${escapeHtml(x.programName||'—')}</td><td>${escapeHtml(x.handler||'—')}</td><td>${x.sourceUrl?'在线文档':x.sourceSheet?'导入':'手工'}</td><td><button data-action="detail" data-index="${i}">详情</button><button data-action="edit" data-index="${i}">编辑</button><button data-action="delete" data-index="${i}" class="danger">删除</button></td></tr>`}).join(''):'<tr><td colspan="10" class="empty">没有符合条件的问题单</td></tr>';$('#count').textContent=`共 ${total} 条`;$('#pageText').textContent=`第 ${page} / ${Math.max(1,Math.ceil(total/30))} 页`;$('#prev').disabled=page<=1;$('#next').disabled=page*30>=total;await loadSummary()}catch(error){toast(error.message,true)}}
    const fields=[['ticketNumber','Q 单编号'],['testStatus','测试状态'],['workflowStatus','变动状态（如 处理完成）'],['resolved','是否解决'],['category','类别'],['caseName','个案书名'],['programName','程序名称'],['handler','问题处理人'],['owner','负责顾问'],['developer','开发人员'],['description','问题描述 / 开发说明',true],['solutionNote','解决描述',true],['developmentNote','开发备注',true],['remark','备注',true],['sourceUrl','来源文档链接']];
    function edit(issue=null){current=issue;$('#editorTitle').textContent=issue?'编辑问题':'新建问题';$('#editorFields').innerHTML=fields.map(([key,label,multiline])=>`<div class="field ${multiline?'span2':''}"><label>${label}</label>${multiline?`<textarea data-field="${key}">${escapeHtml(issue?.[key]||'')}</textarea>`:`<input data-field="${key}" value="${escapeHtml(issue?.[key]||'')}" />`}</div>`).join('');open('editorOverlay')}
    async function save(){const issue=current?{...current}:{};document.querySelectorAll('[data-field]').forEach(node=>issue[node.dataset.field]=node.value.trim());try{const result=await call('save_issue',{projectCode:projectCode(),issue});close('editorOverlay');toast(`已保存 ${result.ticketNumber||result.caseName||'问题单'}${result.workflowStatusChangedAtUtc?'（变动状态时间已记录）':''}`);await load()}catch(error){toast(error.message,true)}}
    function detail(issue){const labels={ticketNumber:'Q 单编号',testStatus:'测试状态',resolved:'是否解决',category:'类别',caseName:'个案书名',programName:'程序名称',handler:'问题处理人',owner:'负责顾问',developer:'开发人员',description:'问题描述',solutionNote:'解决描述',developmentNote:'开发说明',remark:'备注',sourceFileName:'来源文件',sourceSheet:'来源工作表',sourceRow:'来源行号',updatedBy:'最后修改人',updatedAtUtc:'更新时间'};const rows=Object.entries(labels).map(([key,label])=>`<dt>${label}</dt><dd>${escapeHtml(issue[key]||'—')}</dd>`);rows.push(`<dt>变动状态</dt><dd>${escapeHtml(issue.workflowStatus||'未标记')}</dd>`);rows.push(`<dt>变动状态时间</dt><dd>${escapeHtml(localTime(issue.workflowStatusChangedAtUtc)||'—')}</dd>`);const history=(issue.workflowHistory||[]).map(step=>`<li>${escapeHtml(localTime(step.atUtc))} · ${escapeHtml(step.by||'—')}：${escapeHtml(step.from||'（空）')} → ${escapeHtml(step.to||'（空）')}</li>`).join('');if(history)rows.push('<dt>变动记录</dt><dd><ul class="history">'+history+'</ul></dd>');if(issue.sourceUrl?.startsWith('https://'))rows.push('<dt>来源链接</dt><dd><a href="'+escapeHtml(issue.sourceUrl)+'" target="_blank" rel="noopener noreferrer">打开原始文档</a></dd>');rows.push(...Object.entries(issue.extraFields||{}).map(([key,value])=>`<dt>${escapeHtml(key)}</dt><dd>${escapeHtml(value)}</dd>`));$('#detail').innerHTML=rows.join('');open('detailOverlay')}
    async function importData(){const file=$('#importFile').files[0],text=$('#importText').value.trim(),sourceUrl=$('#sourceUrl').value.trim();if(!file&&!text){toast('请选择文件或粘贴表格内容',true);return}if(file&&file.size>5*1024*1024){toast('文件不能超过 5 MB',true);return}try{const args={projectCode:projectCode(),sourceUrl};if(file){args.fileName=file.name;args.base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)})}else{args.fileName='在线文档粘贴.tsv';args.text=text}$('#importSubmit').disabled=true;const result=await call('import_issues',args);close('importOverlay');toast(`解析 ${result.parsed} 条，新增 ${result.created} 条，更新 ${result.updated} 条，跳过 ${result.skipped} 行`);page=1;await load()}catch(error){toast(error.message,true)}finally{$('#importSubmit').disabled=false}}
    async function buildReport(){if(!projectCode())return;const date=$('#reportDate').value;const r=await call('daily_report',{projectCode:projectCode(),date});const statusLine=r.byStatus.map(x=>`${x.name} ${x.count} 条`).join('，');$('#reportSummary').textContent=`${r.date} 共 ${r.total} 条变动${statusLine?'（'+statusLine+'）':''}`;const lines=[`【${r.date}】问题单变动日报（${r.total} 条）`];if(r.total===0)lines.push('当天无变动状态变化的问题单。');r.items.forEach((x,i)=>{lines.push(`${i+1}. ${x.ticketNumber||'（无单号）'}｜${x.caseName||x.programName||''}`);lines.push(`   变动：${x.workflowStatus||'（空）'}（${x.changedAtLocal}，${x.updatedBy||'—'}）`);if(x.solutionNote)lines.push(`   解决：${x.solutionNote}`);if(x.description)lines.push(`   问题：${x.description}`)});$('#reportText').value=lines.join('\n')}
    async function openReport(){$('#reportDate').value=new Date().toLocaleDateString('sv-SE');try{await buildReport();open('reportOverlay')}catch(error){toast(error.message,true)}}
    $('#project').addEventListener('change',()=>{page=1;load()});$('#searchButton').onclick=()=>{page=1;load()};$('#keyword').addEventListener('keydown',e=>{if(e.key==='Enter'){page=1;load()}});$('#status').onchange=()=>{page=1;load()};$('#workflow').onchange=()=>{page=1;load()};$('#prev').onclick=()=>{page--;load()};$('#next').onclick=()=>{page++;load()};$('#newButton').onclick=()=>edit();$('#saveButton').onclick=save;$('#importButton').onclick=()=>open('importOverlay');$('#importSubmit').onclick=importData;$('#reportButton').onclick=openReport;$('#reportRefresh').onclick=()=>buildReport().catch(error=>toast(error.message,true));$('#reportCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('#reportText').value);toast('日报内容已复制')}catch{ $('#reportText').select();document.execCommand('copy');toast('日报内容已复制')}};document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>close(button.dataset.close));$('#rows').addEventListener('click',async event=>{const button=event.target.closest('[data-action]');if(!button)return;const issue=items[Number(button.dataset.index)];if(button.dataset.action==='detail')detail(issue);if(button.dataset.action==='edit')edit(issue);if(button.dataset.action==='delete'&&confirm(`确定删除 ${issue.ticketNumber||issue.caseName||'此问题单'}？`)){try{await call('delete_issue',{projectCode:projectCode(),id:issue.id});toast('已删除');await load()}catch(error){toast(error.message,true)}}});loadProjects();
  </script>
</body>
</html>
